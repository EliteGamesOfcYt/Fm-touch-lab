<!DOCTYPE html>

<title>Manager Photo Lab | FM Touch Lab</title>
<style>
:root{--bg:#0a0f1c;--card:#121a2b;--line:#1f2c44;--txt:#e8eef7;--sub:#93a4bd;--neon:#2eff8f;--neon2:#37c4ff;--warn:#ffb648;--bad:#ff5d6c;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;min-height:100vh;padding-bottom:40px}

.logo span b{color:var(--neon)}
.backlink{font-size:13px;font-weight:800}
.wrap{max-width:920px;margin:0 auto;padding:18px 14px 0}
.ucinp{background:#0d1526;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:15px}
.ucinp:focus{outline:none;border-color:var(--neon)}
.uchero{position:relative;text-align:center;border-radius:20px;overflow:hidden;padding:20px 14px 14px;border:1px solid #37c4ff55;background:radial-gradient(300px 120px at 50% -20%,#37c4ff26,transparent 60%),linear-gradient(165deg,#141a2c,#0f1526)}
